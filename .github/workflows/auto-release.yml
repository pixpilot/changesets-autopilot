name: Auto Release Action

on:
  workflow_run:
    workflows: [ "Continuous Integration" ]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: action-release-main
  cancel-in-progress: false

jobs:
  release:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' &&
            github.event.workflow_run.head_branch || 'main' }}

      - name: Compute next release tag
        id: next-version
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          if git tag --points-at HEAD | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Current commit already has a semver tag. Skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)
          if [[ -z "$LAST_TAG" ]]; then
            LAST_TAG="v0.0.0"
          fi

          echo "Last tag: $LAST_TAG"

          if [[ "$LAST_TAG" == "v0.0.0" ]]; then
            SUBJECTS=$(git log --format=%s)
            BODIES=$(git log --format=%b)
          else
            SUBJECTS=$(git log --format=%s "${LAST_TAG}..HEAD")
            BODIES=$(git log --format=%b "${LAST_TAG}..HEAD")
          fi

          BUMP="patch"
          if echo "$SUBJECTS" | grep -Eq '^[^:]+!:' || echo "$BODIES" | grep -Eq 'BREAKING CHANGE'; then
            BUMP="major"
          elif echo "$SUBJECTS" | grep -Eq '^feat(\(.+\))?:'; then
            BUMP="minor"
          fi

          VERSION="${LAST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEXT_TAG="v${MAJOR}.${MINOR}.${PATCH}"

          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "last_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"
          echo "next_tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.next-version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_TAG: ${{ steps.next-version.outputs.next_tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$NEXT_TAG" >/dev/null 2>&1; then
            echo "Release $NEXT_TAG already exists. Skipping."
            exit 0
          fi

          gh release create "$NEXT_TAG" \
            --target "$GITHUB_SHA" \
            --title "$NEXT_TAG" \
            --generate-notes

      - name: Release summary
        if: steps.next-version.outputs.should_release == 'true'
        run: |
          echo "Created release: ${{ steps.next-version.outputs.next_tag }}"
          echo "Bump type: ${{ steps.next-version.outputs.bump }}"

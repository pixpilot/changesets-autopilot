name: Changeset Autopilot
description: Automate changeset-based releases with branch-specific configurations
author: Pixpilot

# Add your action's branding here. This will appear on the GitHub Marketplace.
branding:
  icon: package
  color: blue

# Define your inputs here.
inputs:
  GITHUB_TOKEN:
    description: GitHub token for authentication
    required: true
  REGISTRY_TOKEN:
    description: >-
      Token used to authenticate against the registry each package publishes to.
      For npmjs use an npm automation token; for GitHub Packages use the
      built-in secrets.GITHUB_TOKEN (needs permissions.packages: write). Leave
      empty to use npm Trusted Publisher (OIDC), which npmjs supports only.
    required: false
  NPM_TOKEN:
    description: Deprecated alias for REGISTRY_TOKEN. Use REGISTRY_TOKEN instead.
    required: false
    deprecationMessage: Use REGISTRY_TOKEN instead; NPM_TOKEN also covers non-npm registries and the name is misleading.
  BOT_NAME:
    description: Optional bot name
    required: false
    default: changesets-autopilot
  BRANCHES:
    description: Branch configuration for releases (YAML array)
    required: false
  CREATE_RELEASE:
    description: Enable or disable GitHub release creation
    required: false
    default: 'true'
  PUSH_TAGS:
    description: Enable or disable pushing tags to GitHub
    required: false
    default: 'true'
  AUTO_CHANGESET:
    description: Enable or disable automatic changeset generation and versioning
    required: false
    default: 'true'
  provenance:
    description: Enable npm provenance attestation
    required: false
    default: 'false'

# Define your outputs here.
outputs:
  published:
    description: Whether packages were published
  published-packages:
    description: >-
      JSON array of the published packages, e.g.
      [{"name":"@scope/pkg","version":"1.2.0"}]. "[]" when nothing was published.
  published-versions:
    description: >-
      Comma-separated name@version of the published packages, e.g.
      "@scope/a@1.2.0, @scope/b@2.0.0". Empty when nothing was published.
  release-summary:
    description: >-
      Plain-text outcome for notifications: the published packages, why nothing
      was published, or why the release failed.

runs:
  using: node24
  main: dist/index.js
